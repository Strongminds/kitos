apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    easyhosting.io/display-name: kitos
    easyhosting.io/manifest-path: infrastructure/dev/kitos-dev/database-servers/kitos/cluster.yaml
  labels:
    app.kubernetes.io/managed-by: easyhosting
    easyhosting.io/resource-kind: database-server
    easyhosting.io/resource-id: b8616e59539544e298120292ca442d46
    easyhosting.io/application-id: kitos-dev
  name: kitos
  namespace: kitos-dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 1Gi
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
  managed:
    roles:
    - name: kitos
      ensure: present
      login: true
      createdb: true
      passwordSecret:
        name: db-role-secret-kitos
    - name: hangfire
      ensure: present
      login: true
      createdb: true
      passwordSecret:
        name: db-role-secret-hangfire
    - name: pubsub
      ensure: present
      login: true
      createdb: true
      passwordSecret:
        name: db-role-secret-pubsub