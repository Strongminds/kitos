apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: Presentation.Web/Dockerfile
    easyhosting.io/service-unique-id: 6602d6ca-4ed0-433e-9627-f7639ec655ab
    easyhosting.io/easy-hosting-domain-name: 6602d6ca-4ed0-433e-9627-f7639ec655ab.dev.os2-kitos.easyhosting.strongminds.dev
  labels:
    app: kitos-pubsub
  name: kitos-pubsub
  namespace: kitos-dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-pubsub
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: monitoring/sidecar-otel-collector
        easyhosting.io/otlp-logs: "true"
      labels:
        app: kitos-pubsub
        app.kubernetes.io/name: kitos-pubsub
    spec:
      containers:
      - env:
        - name: PUBSUB_API_KEY
          valueFrom:
            secretKeyRef:
              key: PubSubApiKey
              name: user-secret
        - name: RABBIT_MQ_USER
          valueFrom:
            secretKeyRef:
              key: RabbitMqUsername
              name: user-secret
        - name: RABBIT_MQ_PASSWORD
          valueFrom:
            secretKeyRef:
              key: RabbitMqPassword
              name: user-secret
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              key: PubSubConnectionString
              name: user-secret
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: JwtValidation__ValidationEndpoint
          valueFrom:
            configMapKeyRef:
              key: KitosApiBaseUrlInternal
              name: user-variables
        - name: RabbitMQ__HostName
          valueFrom:
            configMapKeyRef:
              key: RabbitMQ__HostName
              name: user-variables
        image: '{will be replaced by build pipeline}'
        name: kitos-pubsub
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 512Mi
            cpu: 1
          requests:
            memory: 128Mi
            cpu: 100m
      imagePullSecrets:
      - name: ab5abbe3-d515-459a-83e8-c47a88a0fa1c