apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: easy-hosting-issuer
  name: kitos-pubsub
  namespace: kitos-dev
spec:
  rules:
  - host: kitos-pubsub.strongminds.tech
    http:
      paths:
      - backend:
          service:
            name: kitos-pubsub
            port:
              name: http
        path: /
        pathType: Prefix
  - host: 6602d6ca-4ed0-433e-9627-f7639ec655ab.dev.os2-kitos.easyhosting.strongminds.dev
    http:
      paths:
      - backend:
          service:
            name: kitos-pubsub
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - kitos-pubsub.strongminds.tech
    secretName: kitos-pubsub-strongminds-tech-tls
  - hosts:
    - 6602d6ca-4ed0-433e-9627-f7639ec655ab.dev.os2-kitos.easyhosting.strongminds.dev
    secretName: 6602d6ca-4ed0-433e-9627-f7639ec655ab-dev-os2-kitos-easyhosting-strongminds-dev-tls