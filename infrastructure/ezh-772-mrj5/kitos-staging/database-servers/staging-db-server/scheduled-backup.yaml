apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: staging-db-server-daily
  namespace: kitos-staging
  labels:
    app.kubernetes.io/managed-by: easyhosting
    easyhosting.io/resource-kind: database-server
    easyhosting.io/resource-id: "fba2bf1dcc0c4ba5a01cd13f9e0abd6b"
    easyhosting.io/application-id: "kitos-staging"
  annotations:
    easyhosting.io/database-catalog: "[]"
spec:
  suspend: true
  schedule: "0 0 0 * * *"
  backupOwnerReference: cluster
  cluster:
    name: staging-db-server