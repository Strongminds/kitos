apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: easy-hosting-issuer
  name: kitos-pubsub
  namespace: kitos
spec:
  rules:
  - host: kitos-pubsub.strongminds.tech
    http:
      paths:
      - backend:
          service:
            name: kitos-pubsub
            port:
              name: http
        path: /
        pathType: Prefix
  - host: bbc16f0d-0692-4131-afe7-29f4cf875d2f.kitos-dev.strongminds.easyhosting.strongminds.dev
    http:
      paths:
      - backend:
          service:
            name: kitos-pubsub
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - kitos-pubsub.strongminds.tech
    secretName: kitos-pubsub-strongminds-tech-tls
  - hosts:
    - bbc16f0d-0692-4131-afe7-29f4cf875d2f.kitos-dev.strongminds.easyhosting.strongminds.dev
    secretName: bbc16f0d-0692-4131-afe7-29f4cf875d2f-kitos-dev-strongminds-easyhosting-strongminds-dev-tls