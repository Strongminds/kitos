apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: Dockerfile
    easyhosting.io/service-unique-id: f609671a-9d56-4164-ae33-932e7f0df85b
    easyhosting.io/easy-hosting-domain-name: f609671a-9d56-4164-ae33-932e7f0df85b.kitos-dev.strongminds.easyhosting.strongminds.dev
  labels:
    app: kitos-api
  name: kitos-api
  namespace: kitos
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-api
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: "false"
      labels:
        app: kitos-api
    spec:
      containers:
      - env: []
        image: '{will be replaced by build pipeline}'
        name: kitos-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 512Mi
            cpu: 1
          requests:
            memory: 128Mi
            cpu: 100m
        volumeMounts:
        - mountPath: /temp
          name: kitos-api-storage
          readOnly: false
      imagePullSecrets:
      - name: 90d73529-a238-405b-a079-3eea2e8e36e6
      volumes:
      - name: kitos-api-storage
        persistentVolumeClaim:
          claimName: kitos-api-storage
          readOnly: false