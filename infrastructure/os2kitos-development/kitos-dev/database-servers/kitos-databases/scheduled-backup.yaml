apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kitos-databases-daily
  namespace: kitos-dev
  labels:
    app.kubernetes.io/managed-by: easyhosting
    easyhosting.io/resource-kind: database-server
    easyhosting.io/resource-id: "0712cd39214e420f8453212521486389"
    easyhosting.io/application-id: "kitos-dev"
  annotations:
    easyhosting.io/database-catalog: "[]"
spec:
  suspend: true
  schedule: "0 0 0 * * *"
  backupOwnerReference: cluster
  cluster:
    name: kitos-databases