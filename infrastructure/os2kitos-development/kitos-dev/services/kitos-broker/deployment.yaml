apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: PubSub.Broker/Dockerfile
    easyhosting.io/service-unique-id: 9b13e5d3-84ff-4402-9b42-5808339ccff3
    easyhosting.io/easy-hosting-domain-name: 9b13e5d3-84ff-4402-9b42-5808339ccff3.os2kitos-development.strongminds.easyhosting.strongminds.dev
  labels:
    app: kitos-broker
  name: kitos-broker
  namespace: kitos-dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-broker
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: monitoring/sidecar-otel-collector
        easyhosting.io/otlp-logs: "true"
      labels:
        app: kitos-broker
        app.kubernetes.io/name: kitos-broker
    spec:
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              key: RabbitMqUsername
              name: user-secret
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: RabbitMqPassword
              name: user-secret
        image: ghcr.io/strongminds/kitos-kitos-broker@sha256:bc3f535ec121f3a1e1587822277ee1e5ed939a6ab3d4b456d05997714ca121da
        name: kitos-broker
        ports:
        - containerPort: 5672
          name: ampq
          protocol: TCP
        - containerPort: 15672
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 2Gi
            cpu: 2
          requests:
            memory: 1Gi
            cpu: 1
      imagePullSecrets:
      - name: ac6379be-068d-4385-a6c6-6a13c7f5f2e6