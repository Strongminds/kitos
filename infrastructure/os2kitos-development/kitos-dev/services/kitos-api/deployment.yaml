apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: Presentation.Web/Dockerfile
    easyhosting.io/service-unique-id: 1c6c6fde-9c36-4905-bbc0-449acd081477
    easyhosting.io/easy-hosting-domain-name: 1c6c6fde-9c36-4905-bbc0-449acd081477.os2kitos-development.strongminds.easyhosting.strongminds.dev
  labels:
    app: kitos-api
  name: kitos-api
  namespace: kitos-dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-api
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: "false"
        easyhosting.io/otlp-logs: "false"
      labels:
        app: kitos-api
        app.kubernetes.io/name: kitos-api
    spec:
      containers:
      - env:
        - name: AppSettings__LogFilePath
          valueFrom:
            configMapKeyRef:
              key: LogFilePath
              name: user-variables
        - name: Smtp__PickupDirectoryLocation
          valueFrom:
            configMapKeyRef:
              key: PickupDirectoryLocation
              name: user-variables
        - name: Smtp__DeliveryMethod
          value: SpecifiedPickupDirectory
        - name: ASPNETCORE_ENVIRONMENT
          value: Dev
        - name: Database__Provider
          value: PostgreSql
        - name: Hangfire__Provider
          value: PostgreSql
        - name: ConnectionStrings__KitosContext
          valueFrom:
            secretKeyRef:
              key: KitosDbConnectionString
              name: user-secret
        - name: ConnectionStrings__kitos_HangfireDB
          valueFrom:
            secretKeyRef:
              key: HangfireDbConnectionString
              name: user-secret
        - name: AppSettings__BaseUrl
          value: https://kitos-dev.strongminds.tech/
        - name: AppSettings__PubSubBaseUrl
          valueFrom:
            configMapKeyRef:
              key: PubSubBaseUrl
              name: user-variables
        - name: AppSettings__SecurityKeyString
          valueFrom:
            secretKeyRef:
              key: SecurityKeyString
              name: user-secret
        - name: Smtp__Host
          valueFrom:
            configMapKeyRef:
              key: SmtpNetworkHost
              name: user-variables
        - name: Smtp__Port
          valueFrom:
            configMapKeyRef:
              key: SmtpNetworkPort
              name: user-variables
        - name: Smtp__Password
          valueFrom:
            secretKeyRef:
              key: SmtpPassword
              name: user-secret
        image: ghcr.io/strongminds/kitos-kitos-api@sha256:1e4a574a4591aa0e23fa5a257513c96ac173d5f0415af54b728ad9edb2e61aae
        name: kitos-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 4Gi
            cpu: 2
          requests:
            memory: 2Gi
            cpu: 1
      imagePullSecrets:
      - name: ac6379be-068d-4385-a6c6-6a13c7f5f2e6