<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title description">
<title id="title">KITOS MCP — implemented pilot architecture</title>
<desc id="description">ChatGPT reaches a local trusted broker through an outbound OpenAI tunnel. The broker holds KITOS credentials and proxies MCP to an isolated worker using mutual TLS and opaque grants. The worker returns named read requests to the broker's private read boundary. Only the broker calls the KITOS API. An optional local inspector replaces ChatGPT for development.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#334155"/></marker>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #172b45; }
    .title { font-size: 29px; font-weight: 700; }
    .heading { font-size: 19px; font-weight: 650; }
    .body { font-size: 16px; }
    .small { font-size: 14px; fill: #475569; }
    .label { font-size: 14px; font-weight: 600; }
    .wire { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
    .box { stroke-width: 1.5; rx: 12; }
  </style>
</defs>
<rect width="1600" height="950" fill="#ffffff"/>
<text x="40" y="45" class="title">KITOS MCP · as implemented</text>
<text x="40" y="74" class="small">Local Podman pilot · 27 October 2026</text>

<rect x="70" y="110" width="250" height="90" class="box" fill="#eef2ff" stroke="#818cf8"/>
<text x="195" y="148" text-anchor="middle" class="heading">ChatGPT / KITOS-W01</text>
<text x="195" y="177" text-anchor="middle" class="body">MCP client</text>
<rect x="450" y="110" width="360" height="90" class="box" fill="#eef2ff" stroke="#818cf8"/>
<text x="630" y="148" text-anchor="middle" class="heading">OpenAI Secure MCP Tunnel</text>
<text x="630" y="177" text-anchor="middle" class="body">Hosted tunnel endpoint</text>
<path d="M320 155 H450" class="wire"/>
<text x="385" y="132" text-anchor="middle" class="small">MCP + OAuth</text>

<rect x="35" y="275" width="1270" height="540" class="box" fill="#f8fafc" stroke="#94a3b8"/>
<text x="55" y="305" class="heading">Developer workstation</text>
<rect x="380" y="325" width="905" height="470" class="box" fill="#eff6ff" stroke="#93c5fd"/>
<text x="400" y="350" class="label">Podman · separate containers</text>

<rect x="70" y="365" width="250" height="105" class="box" fill="#ffffff" stroke="#94a3b8"/>
<text x="195" y="395" text-anchor="middle" class="heading">tunnel-client.exe</text>
<text x="195" y="423" text-anchor="middle" class="body">Runs on host</text>
<text x="195" y="448" text-anchor="middle" class="small">OpenAI runtime API key</text>
<path d="M305 365 V240 H630 V200" class="wire"/>
<text x="410" y="231" text-anchor="middle" class="label">Outbound HTTPS tunnel</text>

<rect x="400" y="365" width="410" height="390" class="box" fill="#ecfdf5" stroke="#34a78b"/>
<text x="420" y="393" class="heading">Mcp.Broker · trusted</text>
<rect x="420" y="410" width="370" height="80" class="box" fill="#ffffff" stroke="#6bb9a6"/>
<text x="605" y="440" text-anchor="middle" class="heading">Public OAuth + MCP ingress</text>
<text x="605" y="468" text-anchor="middle" class="body">localhost:7443 · /mcp</text>
<path d="M320 415 H350 V450 H420" class="wire"/>
<text x="357" y="391" text-anchor="middle" class="small">HTTPS</text>
<text x="357" y="408" text-anchor="middle" class="small">MCP token</text>

<rect x="420" y="525" width="370" height="75" class="box" fill="#ffffff" stroke="#6bb9a6"/>
<text x="605" y="554" text-anchor="middle" class="heading">Identity, consent and grants</text>
<text x="605" y="581" text-anchor="middle" class="body">KITOS JWT + bounded in-memory state</text>
<path d="M605 490 V525" class="wire"/>
<rect x="420" y="640" width="370" height="90" class="box" fill="#ffffff" stroke="#6bb9a6"/>
<text x="605" y="671" text-anchor="middle" class="heading">Private read boundary</text>
<text x="605" y="696" text-anchor="middle" class="body">broker:7446 · POST /reads</text>
<text x="605" y="718" text-anchor="middle" class="small">Grant checks · GET allowlist · budgets</text>
<path d="M605 600 V640" class="wire"/>
<text x="619" y="624" class="small">Resolve caller / credential</text>

<rect x="70" y="595" width="250" height="115" class="box" fill="#ffffff" stroke="#94a3b8"/>
<text x="195" y="626" text-anchor="middle" class="heading">Developer's browser</text>
<text x="195" y="654" text-anchor="middle" class="body">Paste KITOS JWT + consent</text>
<text x="195" y="681" text-anchor="middle" class="small">HTTPS /connect/authorize</text>
<path d="M320 653 H365 V480 H420" class="wire"/>

<rect x="990" y="410" width="270" height="175" class="box" fill="#fff7ed" stroke="#e6a35e"/>
<text x="1125" y="440" text-anchor="middle" class="heading">Mcp.Worker · isolated</text>
<text x="1125" y="469" text-anchor="middle" class="body">worker:7444 · /mcp</text>
<text x="1125" y="496" text-anchor="middle" class="body">MCP tools + query validation</text>
<text x="1125" y="522" text-anchor="middle" class="small">Mcp.Core: embedded JSON catalog</text>
<text x="1125" y="549" text-anchor="middle" class="small">No KITOS JWT / no internet egress</text>
<text x="1125" y="572" text-anchor="middle" class="small">Stateless Streamable HTTP</text>
<path d="M790 450 H990" class="wire"/>
<text x="890" y="432" text-anchor="middle" class="label">mTLS + opaque grant</text>
<path d="M1125 585 V680 H790" class="wire"/>
<text x="930" y="638" text-anchor="middle" class="label">mTLS · POST /reads</text>
<text x="930" y="661" text-anchor="middle" class="small">systems.list + opaque grant</text>

<rect x="1340" y="625" width="235" height="110" class="box" fill="#f1f5f9" stroke="#64748b"/>
<text x="1457" y="654" text-anchor="middle" class="heading">KITOS staging API</text>
<text x="1457" y="679" text-anchor="middle" class="body">Existing identity + permissions</text>
<text x="1457" y="701" text-anchor="middle" class="small">POST token/validate (auth)</text>
<text x="1457" y="723" text-anchor="middle" class="small">GET it-systems (data)</text>
<path d="M810 710 H850 V777 H1457 V735" class="wire"/>
<text x="1125" y="766" text-anchor="middle" class="label">Broker → KITOS · HTTPS + caller's KITOS JWT</text>

<text x="45" y="852" class="body">Server credential custody: only the broker retains the KITOS JWT; pinned mTLS and caller-bound grants protect private calls.</text>
<text x="45" y="880" class="body">Current tools: get_domain_catalog + query_kitos · name contains → UUID/name · first page, up to 100 · best-effort consistency.</text>
<text x="45" y="908" class="small">Optional host client: Tools.Mcp.LocalClient on :7445 replaces ChatGPT for local inspection (separate configuration).</text>
<text x="45" y="932" class="small">Responses return along the request paths. OAuth access lasts up to five minutes; broker restart clears credentials/grants. No local database.</text>
</svg>